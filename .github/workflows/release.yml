name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Linux Binary
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o hmd-linux-amd64 .

      - name: Build Windows Binary
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o hmd-windows-amd64.exe .

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            hmd-linux-amd64
            hmd-windows-amd64.exe
