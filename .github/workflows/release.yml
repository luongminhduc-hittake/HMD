name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Keep CI on the exact toolchain recorded in go.mod.
          go-version-file: go.mod

      - name: Build Linux Binary
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o hmd-linux-amd64 .

      - name: Build Windows Resource Object
        run: |
          # rsrc_windows_amd64.syso is generated, not committed: embed the icon at build time.
          go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico assets/icon.ico -o rsrc_windows_amd64.syso

      - name: Build Windows Binary
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o hmd-windows-amd64.exe .

      - name: Resolve Version Tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'CurrentVersion = "' internal/updater/updater.go | sed -E 's/.*"([^"]+)".*/\1/')
            echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: hittakeMD ${{ steps.tag.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            hmd-linux-amd64
            hmd-windows-amd64.exe
