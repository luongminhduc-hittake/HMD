<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#BA135D"/>
      <stop offset="100%" stop-color="#240B36"/>
    </linearGradient>

    <!-- Foreground Play/Arrow Gradient -->
    <linearGradient id="fgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F5"/>
    </linearGradient>

    <!-- Subtle Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Background Container -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="106" ry="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Stylized Play Button & Download Arrow Emblem -->
  <g filter="url(#innerGlow)">
    <!-- Play Triangle Form (left/main body) -->
    <path d="M 185 145 C 172 137 156 146 156 162 L 156 350 C 156 366 172 375 185 367 L 268 316 L 268 196 Z" fill="url(#fgGrad)"/>

    <!-- Integrated Downward Download Arrow (center-right body) -->
    <!-- Arrow Stem -->
    <rect x="290" y="150" width="48" height="124" rx="12" fill="url(#fgGrad)"/>
    
    <!-- Arrow Head -->
    <path d="M 252 260 C 244 260 239 270 245 276 L 306 348 C 310 353 318 353 322 348 L 383 276 C 389 270 384 260 376 260 L 350 260 L 350 260 L 278 260 Z" fill="url(#fgGrad)"/>

    <!-- Bottom Cradle Tray (Download completion bar) -->
    <rect x="220" y="372" width="188" height="22" rx="11" fill="url(#accentGrad)"/>
  </g>
</svg>
